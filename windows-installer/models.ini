; llama-server router preset (--models-preset), Windows edition.
;
; Paths are RELATIVE to the server's working directory.  launcher.bat does
; `cd /d "%~dp0"` before starting, so the CWD is always the install folder
; and ./models/<file>.gguf resolves to {app}\models\<file>.gguf.
;
; - Section name = value clients send in the JSON "model" field
;   (POST /v1/chat/completions, /v1/embeddings, ...) or ?model=... on GETs.
; - Keys are long CLI argument names without leading "--".
; - The [*] section sets defaults shared by every model.

version = 1

[*]
ctx-size       = 8192
n-gpu-layers   = 99
; ggml-cuda has a generic "tile" flash-attention kernel for GPUs without
; tensor cores, so Pascal (GTX 1080 Ti, sm_61) works too.  The win is VRAM
; (fused softmax, no materialised attention matrix), not throughput.
flash-attn     = on
threads        = -1

; ---------------------------------------------------------------------------
; Chat model: Qwen2.5-7B-Instruct (Q5_K_M, ~5.4 GB)
; ---------------------------------------------------------------------------
[qwen2.5-chat]
model         = ./models/Qwen2.5-7B-Instruct-Q5_K_M.gguf
jinja         = true
ctx-size      = 8192

; ---------------------------------------------------------------------------
; Embedding model: GTE-Qwen2-1.5B-instruct (Q8_0, ~1.7 GB).
; Uses "last" token pooling, which is what this model was trained for.
; ---------------------------------------------------------------------------
[gte-qwen2-embed]
model         = ./models/gte-Qwen2-1.5B-instruct-Q8_0.gguf
embeddings    = true
pooling       = last
ctx-size      = 32768
