variables:
  # Runner is configured with the host's /var/run/docker.sock mounted into
  # job containers — so dind services are NOT needed and would fail (the
  # bound socket conflicts with dind's own socket bind).  Use the host
  # docker daemon directly via the mounted socket.
  DOCKER_BUILDKIT: "1"
  WORK_DIR: ${CI_PROJECT_NAME}
  BRANCH: ${CI_COMMIT_REF_NAME}
  IMG_NAME: "llama_dual"

  # Nexus registry — same as the existing build_service uses.
  REGISTRY: "nexus.scan-dev.com:6001"

  # CUDA architectures baked into the build.  Pinned to what the 12.2.2
  # base image actually supports:
  #
  #   61-real    Pascal      GTX 10-series, incl. GTX 1080 Ti  <-- required SKU
  #   75-virtual Turing      RTX 20-series, T4, Quadro RTX
  #   80-virtual Ampere DC   A100, A30
  #   86-real    Ampere      RTX 30-series, A40, A10
  #   89-real    Ada         RTX 40-series, L4, L40
  #
  # Blackwell (sm_120a / 121a) is intentionally absent: those kernels need
  # CUDA >= 12.8 (MXFP4 instructions), and this image is built on 12.2.2
  # to stay compatible with the deployment host's R535 driver.  If/when
  # the host driver is bumped to R570+, also raise CUDA_VERSION in
  # docker-dual/Dockerfile and add 120a-real back here.
  CUDA_ARCH: "61-real;75-virtual;80-virtual;86-real;89-real"

  # Registry image name; each job pushes one rolling tag (:dev / :release).
  RELEASE_IMG: "${REGISTRY}/llama_dual"

  # Number of inference requests the :release image serves before it asks
  # for activation (see build_llama_dual_release below and docker-dual/Dockerfile).
  TRIAL_LIMIT: "50"

stages:
  - build

# =========================================================================
# :dev — llama-dual image WITHOUT the license subsystem (unrestricted),
# built on master OR dev.  Builds llama-server with CUDA support and bakes
# docker-dual/models.ini into /config/models.ini.  The image expects GGUF
# files mounted into /models at runtime (see docker-dual/README.md).
#
# Single rolling tag :dev, overwritten by every build (a push to either
# branch replaces it).  The previous :dev is pulled as the BuildKit cache
# donor for incremental rebuilds.
# =========================================================================
build_llama_dual:
  stage: build
  image: docker:24.0.9
  timeout: 2h
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "dev"
  before_script:
  - echo "REGISTRY=[$REGISTRY] RELEASE_IMG=[$RELEASE_IMG] CUDA_ARCH=[$CUDA_ARCH]"
  - docker login -u admin -p $NEXUS_PASS nexus.scan-dev.com:6001
  script:
  # 1. Pull the previous :dev as a cache donor (ignored if absent).
  - docker pull $RELEASE_IMG:dev || true
  # 2. Build from the repository root using the dual-model Dockerfile.
  - |
    docker build -f docker-dual/Dockerfile \
      --cache-from $RELEASE_IMG:dev \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      --build-arg CUDA_ARCH="$CUDA_ARCH" \
      -t $RELEASE_IMG:dev \
      .
  # 3. Push the single rolling tag.
  - docker push $RELEASE_IMG:dev
  after_script:
  - echo "=== llama-dual pushed - $RELEASE_IMG:dev ==="
  - docker images $RELEASE_IMG --format "{{.Repository}}:{{.Tag}}  {{.Size}}" | head -n 5

# =========================================================================
# :release — llama-dual image WITH the license subsystem and the trial
# fallback (-DLLAMA_SERVER_TRIAL=ON): TRIAL_LIMIT inference requests per
# install, then HTTP 403 until the product ("LLM" on the License Server) is
# activated — see docker-dual/Dockerfile and src/license/README.md.
#
# The trusted keyring is the PUBLIC k3 key from
# src/license/docs/vectors/keyring.json, i.e. the key the test License
# Server (license.scan-dev.com) signs with.  It is fed to docker build as a
# BuildKit secret.  A different License Server needs its own public key
# here.  Optional overrides: PROVISION_LICENSE_PRODUCT (default LLM) and
# PROVISION_LICENSE_ACTIVATION_URL (default https://license.scan-dev.com).
#
# Single rolling tag :release, overwritten by every build (a push to either
# branch replaces it).  The previous :release is the BuildKit cache donor.
#
# License state (.lic + request counter) lives in /var/lib/provision-llm in
# the container; mount a volume there to persist it across recreation.
# =========================================================================
build_llama_dual_release:
  stage: build
  image: docker:24.0.9
  timeout: 2h
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "dev"
  before_script:
  - echo "REGISTRY=[$REGISTRY] RELEASE_IMG=[$RELEASE_IMG] CUDA_ARCH=[$CUDA_ARCH] TRIAL_LIMIT=[$TRIAL_LIMIT]"
  - docker login -u admin -p $NEXUS_PASS nexus.scan-dev.com:6001
  script:
  # 1. Pull the previous :release as a cache donor (ignored if absent).
  - docker pull $RELEASE_IMG:release || true
  # 2. Materialise the k3 keyring for the build secret.
  - cp src/license/docs/vectors/keyring.json license_keyring.json
  - echo "[license] baking the public k3 key ($(wc -c < license_keyring.json) bytes) - test License Server"
  # 3. Build the licensed trial variant (TRIAL=1) and tag it :release.
  - |
    docker build -f docker-dual/Dockerfile \
      --cache-from $RELEASE_IMG:release \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      --build-arg CUDA_ARCH="$CUDA_ARCH" \
      --build-arg TRIAL=1 \
      --build-arg TRIAL_LIMIT="$TRIAL_LIMIT" \
      --build-arg LICENSE_PRODUCT="${PROVISION_LICENSE_PRODUCT:-LLM}" \
      --build-arg LICENSE_ACTIVATION_URL="${PROVISION_LICENSE_ACTIVATION_URL:-https://license.scan-dev.com}" \
      --secret id=license_keyring,src=license_keyring.json \
      -t $RELEASE_IMG:release \
      .
  # 4. Push the single rolling tag.
  - docker push $RELEASE_IMG:release
  after_script:
  - rm -f license_keyring.json
  - echo "=== llama-dual pushed - $RELEASE_IMG:release ==="
  - docker images $RELEASE_IMG --format "{{.Repository}}:{{.Tag}}  {{.Size}}" | head -n 5
