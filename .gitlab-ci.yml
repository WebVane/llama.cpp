variables:
  # Runner is configured with the host's /var/run/docker.sock mounted into
  # job containers — so dind services are NOT needed and would fail (the
  # bound socket conflicts with dind's own socket bind).  Use the host
  # docker daemon directly via the mounted socket.
  DOCKER_BUILDKIT: "1"
  WORK_DIR: ${CI_PROJECT_NAME}
  BRANCH: ${CI_COMMIT_REF_NAME}
  IMG_NAME: "llama_dual"

  # Nexus registry — same as the existing build_service uses.
  REGISTRY: "nexus.scan-dev.com:6001"

  # CUDA architectures baked into the build.  Pinned to what the 12.2.2
  # base image actually supports:
  #
  #   61-real    Pascal      GTX 10-series, incl. GTX 1080 Ti  <-- required SKU
  #   75-virtual Turing      RTX 20-series, T4, Quadro RTX
  #   80-virtual Ampere DC   A100, A30
  #   86-real    Ampere      RTX 30-series, A40, A10
  #   89-real    Ada         RTX 40-series, L4, L40
  #
  # Blackwell (sm_120a / 121a) is intentionally absent: those kernels need
  # CUDA >= 12.8 (MXFP4 instructions), and this image is built on 12.2.2
  # to stay compatible with the deployment host's R535 driver.  If/when
  # the host driver is bumped to R570+, also raise CUDA_VERSION in
  # docker-dual/Dockerfile and add 120a-real back here.
  CUDA_ARCH: "61-real;75-virtual;80-virtual;86-real;89-real"

  # Registry image tag (branch/sha/latest suffix is appended per-job below).
  RELEASE_IMG: "${REGISTRY}/llama_dual"

  # Number of inference requests the trial image serves before locking out
  # (see build_llama_dual_trial below and docker-dual/Dockerfile).
  TRIAL_LIMIT: "50"

stages:
  - build

# =========================================================================
# Build llama-dual image on master OR dev.  Builds llama-server with CUDA
# support and bakes docker-dual/models.ini into /config/models.ini.  The
# resulting image expects GGUF files to be mounted into /models at runtime
# (see docker-dual/README.md).
#
# Tag policy (CI_COMMIT_REF_SLUG = "master" or "dev"):
#   :<short-sha>          — every build (immutable pointer)
#   :<branch-slug>        — :master or :dev (rolling pointer for the branch)
#   :latest               — master only (production rollout target)
# =========================================================================
build_llama_dual:
  stage: build
  image: docker:24.0.9
  timeout: 2h
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "dev"
  before_script:
  - echo "REGISTRY=[$REGISTRY] RELEASE_IMG=[$RELEASE_IMG] CUDA_ARCH=[$CUDA_ARCH]"
  - docker login -u admin -p $NEXUS_PASS nexus.scan-dev.com:6001
  script:
  # 1. Pull previous build of this branch as a cache donor for an
  #    incremental rebuild.  Ignored if absent (first build on a branch).
  - docker pull $RELEASE_IMG:$CI_COMMIT_REF_SLUG || true
  # 2. Build from the repository root using the dual-model Dockerfile.
  - |
    docker build -f docker-dual/Dockerfile \
      --cache-from $RELEASE_IMG:$CI_COMMIT_REF_SLUG \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      --build-arg CUDA_ARCH="$CUDA_ARCH" \
      -t $RELEASE_IMG:$CI_COMMIT_SHORT_SHA \
      -t $RELEASE_IMG:$CI_COMMIT_REF_SLUG \
      .
  # 3. Push :<sha> and :<branch-slug> always; :latest only on master so
  #    a dev push doesn't accidentally overwrite the production-rollout tag.
  - docker push $RELEASE_IMG:$CI_COMMIT_SHORT_SHA
  - docker push $RELEASE_IMG:$CI_COMMIT_REF_SLUG
  - |
    if [ "$CI_COMMIT_BRANCH" = "master" ]; then
      docker tag  $RELEASE_IMG:$CI_COMMIT_SHORT_SHA $RELEASE_IMG:latest
      docker push $RELEASE_IMG:latest
    fi
  after_script:
  - echo "=== llama-dual pushed ==="
  - echo "  $RELEASE_IMG:$CI_COMMIT_SHORT_SHA"
  - echo "  $RELEASE_IMG:$CI_COMMIT_REF_SLUG"
  - |
    if [ "$CI_COMMIT_BRANCH" = "master" ]; then
      echo "  $RELEASE_IMG:latest"
    fi
  - docker images $RELEASE_IMG --format "{{.Repository}}:{{.Tag}}  {{.Size}}" | head -n 5

# =========================================================================
# Build the TRIAL llama-dual image: same as build_llama_dual but the server
# is compiled with the license subsystem and the trial fallback
# (-DLLAMA_SERVER_TRIAL=ON): TRIAL_LIMIT inference requests per install,
# then HTTP 403 until the product ("LLM" on the License Server) is
# activated — see docker-dual/Dockerfile and src/license/README.md.
#
# Single rolling image only: one tag, :trial, overwritten every build (we
# keep only the latest trial version — no per-commit / per-branch tags).
# The previous :trial is pulled as the BuildKit cache donor for incremental
# rebuilds.
#
# License state (.lic + request counter) lives in /var/lib/provision-llm in
# the container; mount a volume there to persist it across recreation.
#
# The trusted keyring comes from the PROVISION_LICENSE_KEYRING_JSON CI
# variable (Settings -> CI/CD -> Variables, Protected + Masked; the same
# variable the OCR pipeline uses).  It is fed to docker build as a BuildKit
# secret: the bytes never enter the image layers, only the generated
# keyring_baked.cpp inside the build stage.  Optional overrides:
# PROVISION_LICENSE_PRODUCT (default LLM) and
# PROVISION_LICENSE_ACTIVATION_URL (default https://license.scan-dev.com).
# =========================================================================
build_llama_dual_trial:
  stage: build
  image: docker:24.0.9
  timeout: 2h
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "dev"
  before_script:
  - echo "REGISTRY=[$REGISTRY] RELEASE_IMG=[$RELEASE_IMG] CUDA_ARCH=[$CUDA_ARCH] TRIAL_LIMIT=[$TRIAL_LIMIT]"
  - docker login -u admin -p $NEXUS_PASS nexus.scan-dev.com:6001
  script:
  # 1. Pull the previous :trial image as a cache donor (ignored if absent).
  - docker pull $RELEASE_IMG:trial || true
  # 2. Materialise the keyring for the build secret.  Branch policy (same as
  #    the OCR pipeline):
  #      * dev    -> the PUBLIC k3 test pubkey from src/license/docs/vectors
  #                  (works with the test License Server; NOT for production),
  #                  image tagged :trial-dev so it never replaces :trial.
  #      * master -> PROVISION_LICENSE_KEYRING_JSON (Protected + Masked CI
  #                  variable).  Missing = FATAL: a :trial image with an
  #                  empty keyring could never be activated by a customer.
  - |
    if [ "$CI_COMMIT_BRANCH" = "dev" ]; then
      cp src/license/docs/vectors/keyring.json license_keyring.json
      TRIAL_TAG=trial-dev
      echo "[license] DEV branch - baking the public k3 TEST pubkey, image tag :$TRIAL_TAG"
    elif [ -n "$PROVISION_LICENSE_KEYRING_JSON" ]; then
      printf '%s' "$PROVISION_LICENSE_KEYRING_JSON" > license_keyring.json
      TRIAL_TAG=trial
      echo "[license] keyring materialised ($(wc -c < license_keyring.json) bytes)"
    else
      echo "FATAL: PROVISION_LICENSE_KEYRING_JSON is empty - refusing to build a :trial image that cannot verify any .lic."
      echo "Set it in Settings -> CI/CD -> Variables (Protected + Masked) and make sure this branch is protected."
      exit 1
    fi
    echo "TRIAL_TAG=$TRIAL_TAG" > trial_tag.env
  # 3. Build the trial variant (TRIAL=1) and tag it :trial (master) / :trial-dev (dev).
  - |
    . ./trial_tag.env
    DOCKER_BUILDKIT=1 docker build -f docker-dual/Dockerfile \
      --cache-from $RELEASE_IMG:$TRIAL_TAG \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      --build-arg CUDA_ARCH="$CUDA_ARCH" \
      --build-arg TRIAL=1 \
      --build-arg TRIAL_LIMIT="$TRIAL_LIMIT" \
      --build-arg LICENSE_PRODUCT="${PROVISION_LICENSE_PRODUCT:-LLM}" \
      --build-arg LICENSE_ACTIVATION_URL="${PROVISION_LICENSE_ACTIVATION_URL:-https://license.scan-dev.com}" \
      --secret id=license_keyring,src=license_keyring.json \
      -t $RELEASE_IMG:$TRIAL_TAG \
      .
  # 4. Push the single rolling tag, overwriting the previous trial image.
  - |
    . ./trial_tag.env
    docker push $RELEASE_IMG:$TRIAL_TAG
  after_script:
  - rm -f license_keyring.json trial_tag.env
  - echo "=== llama-dual TRIAL pushed - see the tag printed above ==="
  - docker images $RELEASE_IMG --format "{{.Repository}}:{{.Tag}}  {{.Size}}" | head -n 5
