# nginx site for provision-server on a Linux host (deploy/linux, see
# docs/provision-admin.md, section "Deployment on a Linux host").
#
# OPTIONAL.  This site is one way to keep /admin restricted to the admin
# addresses.  On a host without nginx the server can do that itself: set
# PROVISION_ADMIN_ALLOW_FROM in provision-llm.env (docs/provision-admin.md,
# section 4.3, "Built-in address allow-list") and let the server listen on
# the LAN.  Both together also work: then set
# PROVISION_ADMIN_TRUSTED_PROXIES=127.0.0.1 there (this site sends
# X-Forwarded-For) and leave 127.0.0.1 out of PROVISION_ADMIN_ALLOW_FROM.
# The server then re-checks what this site forwards, but not the host
# itself: a process on the host can send its own X-Forwarded-For straight
# to 127.0.0.1:8080, so for the host only the admin key applies.
#
# The same rules as the Docker front door (docker-dual/nginx/default.conf.template):
#
#   1. /admin, /admin/... and /cors-proxy -> forwarded only for the client
#      addresses in the allow-list below, everybody else gets 403 (JSON).
#   2. everything else -> forwarded unchanged (same paths, same bodies,
#      streaming responses are not buffered).
#
# Install
# -------
#   Debian / Ubuntu:   /etc/nginx/sites-available/provision-llm
#                      + ln -s ../sites-available/provision-llm /etc/nginx/sites-enabled/
#   RHEL / Fedora / SUSE / Arch:  /etc/nginx/conf.d/provision-llm.conf
# Both places are read inside nginx's http {} block, which is where the geo
# and upstream blocks below belong.  Arch's stock nginx.conf reads nothing
# from conf.d: add "include /etc/nginx/conf.d/*.conf;" to its http {} block.
# SELinux (RHEL / Fedora): nginx may listen only on the HTTP ports of the
# policy and connect to no other port.  Allow the public port (again for
# another port in "listen" below) and the connection to the server:
#   sudo semanage port -a -t http_port_t -p tcp 8096   (-m instead of -a if
#                                                       the port is defined)
#   sudo setsebool -P httpd_can_network_connect 1
# Then:
#   sudo nginx -t && sudo systemctl enable nginx && sudo systemctl reload-or-restart nginx
#
# Edit three things at most: the allow-list (geo block), the server address
# (upstream block, = PROVISION_LLM_HOST / PROVISION_LLM_PORT of the service)
# and the public port (listen).
#
# The allow-list
# --------------
# The address that counts is the TCP peer nginx sees, the first field of every
# line in /var/log/nginx/access.log.  On a host (no Docker in between) a request
# made on the machine itself really comes from 127.0.0.1 / ::1, and LAN clients
# come with their own address.  If another proxy or a load balancer sits in
# front of this nginx, every request comes from that proxy: allowing its
# address opens /admin to everyone behind it.
#
# Keep in mind: every account on this host can also reach the server directly
# at 127.0.0.1:8080, past nginx; for them only the admin key protects the
# settings.

geo $provision_llm_admin_allowed {
    default         0;
    # the host itself
    127.0.0.1       1;
    ::1             1;
    # admin workstations / networks, one per line, e.g.
    # 10.64.0.11      1;
    # 10.64.0.0/24    1;
}

upstream provision_llm_server {
    # PROVISION_LLM_HOST:PROVISION_LLM_PORT of the service.  One server and no
    # keep-alive pool: one upstream connection per request, as in Docker.
    server 127.0.0.1:8080;
}

server {
    # Public port; 8096 is what the Docker deployment uses.  For IPv6 clients
    # add "listen [::]:8096;" (nginx refuses to start on it where the kernel
    # has IPv6 disabled).  TLS: add "listen 443 ssl;" with ssl_certificate /
    # ssl_certificate_key -- the admin key travels in a request header.
    listen 8096;
    server_name _;
    server_tokens off;

    # ---- transparency -------------------------------------------------------
    # proxy_pass without a URI part forwards the request line exactly as the
    # client sent it (path, percent-encoding and query string untouched).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Host exactly as the client sent it (including the port).
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Keep the server's own "Server:" header on proxied responses.
    proxy_pass_header Server;
    # Do not drop request headers whose names contain an underscore.
    underscores_in_headers on;

    # No size limit of our own: the server enforces its limit itself
    # (100 MB request body, 32 KiB request line).
    client_max_body_size 0;
    large_client_header_buffers 4 64k;

    # ---- streaming ----------------------------------------------------------
    # Server-sent events (GET /models/sse, "stream": true completions) must
    # reach the client token by token: no response buffering, no compression,
    # and request bodies are passed on while they arrive.
    proxy_buffering off;
    proxy_request_buffering off;
    gzip off;

    # A non-streamed completion sends nothing until it is finished and
    # /models/sse stays silent while no model changes state, so "no bytes for
    # a long time" is normal here.  The server's own timeout is 1 hour.
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 86400s;
    client_body_timeout 3600s;
    send_timeout 3600s;

    # ---- admin API: allow-list, then nobody --------------------------------
    # nginx matches locations against the normalised path: percent-encoding
    # decoded once ("/%61dmin/status" is "/admin/status"), "." and ".."
    # segments resolved, repeated slashes merged; a request line it cannot
    # decode (e.g. "%u0061") is rejected with 400 before any location is
    # tried.  The server routes on the path decoded once as well, so there is
    # no spelling of an /admin URL that the server accepts and these
    # locations miss.  "^~" keeps regex locations from taking over.
    # This assumes the server's routes start at "/": do not run it with
    # --api-prefix behind this file.
    # ("if" with nothing but "return" inside is the safe use of "if" in a
    # location; the 403 is turned into the JSON answer by error_page.)
    location = /admin {
        if ($provision_llm_admin_allowed = 0) {
            return 403;
        }
        error_page 403 @provision_llm_admin_denied;
        proxy_pass http://provision_llm_server;
    }

    location ^~ /admin/ {
        if ($provision_llm_admin_allowed = 0) {
            return 403;
        }
        error_page 403 @provision_llm_admin_denied;
        proxy_pass http://provision_llm_server;
    }

    # ---- the server's CORS proxy: same allow-list ---------------------------
    # With the MCP proxy switched on (--ui-mcp-proxy or --agent) the server
    # fetches any URL a client names at /cors-proxy, its own /admin API on
    # 127.0.0.1 included, and that request does not pass the locations above.
    # While the proxy is off the server answers 403 here for everybody anyway.
    location ^~ /cors-proxy {
        if ($provision_llm_admin_allowed = 0) {
            return 403;
        }
        error_page 403 @provision_llm_cors_proxy_denied;
        proxy_pass http://provision_llm_server;
    }

    # Same error shape as the server's own errors, so API clients and the web
    # UI can tell "not allowed from this address" from anything else.
    location @provision_llm_admin_denied {
        default_type application/json;
        return 403 '{"error":{"code":403,"message":"The admin API is not available from this address","type":"admin_forbidden"}}';
    }

    location @provision_llm_cors_proxy_denied {
        default_type application/json;
        return 403 '{"error":{"code":403,"message":"The CORS proxy is not available from this address","type":"admin_forbidden"}}';
    }

    # ---- everything else: unchanged ----------------------------------------
    location / {
        proxy_pass http://provision_llm_server;
    }
}
