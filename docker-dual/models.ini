; llama-server router preset (--models-preset).
;
; - Section name = the value clients must send in the JSON "model" field
;   (POST /v1/chat/completions, /v1/embeddings, ...) or as ?model=... on GETs.
; - Keys are long CLI argument names without leading "--"
;   (short forms and LLAMA_ARG_* names also work).
; - The [*] section sets defaults shared by every model.
; - Place the .gguf files into the /models volume mount.
;
; GPU placement
; -------------
; Every model runs in its own llama-server child process, so each section
; can pin its model to a GPU with the `device` key (== `--device`):
;
;     device = CUDA0        ; first GPU visible inside the container
;     device = CUDA1        ; second GPU
;     device = CUDA0,CUDA1  ; split one model across both (see --split-mode)
;     device = none         ; CPU only
;
; CUDAn numbering follows PCI bus order (CUDA_DEVICE_ORDER=PCI_BUS_ID is set
; by the image), i.e. it matches `nvidia-smi -L` *among the GPUs exposed to
; the container*.  With `device_ids: ["1"]` in docker-compose.yml only host
; GPU 1 is visible and it becomes CUDA0.  List what the container sees with:
;
;     docker compose run --rm llama-dual --list-devices
;
; The same placement can be overridden from docker-compose.yml without
; touching this file via MODEL_DEVICES="<section>=<dev>,..." ("*=<dev>" for
; every section, e.g. a single-GPU host; see
; entrypoint.sh).  A `device` set in [*] is the default for sections that
; do not set their own.

version = 1

[*]
ctx-size       = 8192
n-gpu-layers   = 99
; ggml-cuda has a generic "tile" flash-attention kernel for GPUs without
; tensor cores (see ggml/src/ggml-cuda/fattn.cu:540), so Pascal works too.
; The win is mostly VRAM (fused softmax, no materialised attention matrix)
; rather than throughput -- Turing+ gets the tensor-core MMA kernel instead.
flash-attn     = on
threads        = -1
; Model processes never go to the network.  A model that lives in the Hugging
; Face cache (downloaded from the admin panel / POST /models) is resolved from
; the files already on disk, so loading it does not depend on huggingface.co
; being reachable and can never turn into a silent multi-GB re-download when
; the upstream repository changes.  To update such a model, delete it and
; download it again.
;   - Downloads still work: the download worker is started without any preset,
;     so this key never reaches it.  (Do NOT set LLAMA_ARG_OFFLINE in the
;     container environment instead -- the worker would inherit that.)
;   - Models given by a local path (`model = /models/...`) are not affected.
;   - A section that must fetch its own `hf-repo` on first load can opt out
;     with `offline = false`.
offline        = true

; ---------------------------------------------------------------------------
; Chat model: Qwen2.5-7B-Instruct (Q5_K_M, ~5.4 GB)
;
; Download example:
;   huggingface-cli download bartowski/Qwen2.5-7B-Instruct-GGUF \
;       Qwen2.5-7B-Instruct-Q5_K_M.gguf --local-dir ./models
; ---------------------------------------------------------------------------
[qwen2.5-chat]
model         = /models/Qwen2.5-7B-Instruct-Q5_K_M.gguf
jinja         = true
ctx-size      = 8192
device        = CUDA1
; Preload at startup and mark as the model the Web UI selects by default
; (see "tags" below: the webui looks for the "default" tag).
load-on-startup = true
tags          = chat, default

; ---------------------------------------------------------------------------
; Embedding model: GTE-Qwen2-1.5B-instruct (Q8_0, ~1.7 GB).
; Uses "last" token pooling, which is what this model was trained for.
;
; Download example:
;   huggingface-cli download second-state/gte-Qwen2-1.5B-instruct-GGUF \
;       gte-Qwen2-1.5B-instruct-Q8_0.gguf --local-dir ./models
; ---------------------------------------------------------------------------
[gte-qwen2-embed]
model         = /models/gte-Qwen2-1.5B-instruct-Q8_0.gguf
embeddings    = true
pooling       = last
ctx-size      = 32768
device        = CUDA0
; Preload together with the chat model, so that both resident models hold
; their GPU memory before anything else is loaded (docker-compose.yml runs
; with MODELS_MAX=3 and pins these two; a model added later gets the one
; remaining slot).
; The router refuses to start when more sections ask for load-on-startup than
; --models-max allows.  entrypoint.sh guards against that: when the limit is
; lower (MODELS_MAX=1 is still the image default, e.g. plain `docker run`) it
; keeps the key for the first sections in file order only and logs a warning,
; i.e. the chat model is preloaded and this one loads on first use, as before.
load-on-startup = true
tags          = embeddings
